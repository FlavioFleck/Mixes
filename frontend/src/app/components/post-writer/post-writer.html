<form class="new-post-box" (ngSubmit)="createPost()">
    <img [src]="'http://localhost:5010/uploads/profile/' + user.profile_image" class="user-profile-picture-small">
    <input [(ngModel)]="content" name="content" type="text" placeholder="What's new?"/>
    <button class="post-button" type="submit">Post</button>
</form>
