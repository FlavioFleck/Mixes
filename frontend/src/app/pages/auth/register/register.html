<div class="auth-background">

  <div class="register-container">

    <!-- PAINEL ESQUERDO -->
    <div class="left-panel">

      <button routerLink="/auth/login" class="back-btn">←</button>

      <h1 class="title">SIGN UP</h1>

      <form class="register-form">

        <input type="text" placeholder="Digite seu nome" />

        <input type="text" placeholder="Digite seu CPF" mask="000.000.000-00"/>

        <input type="email" placeholder="Digite seu email" />

        <input type="password" placeholder="Digite sua senha" />

        <input type="text" placeholder="Digite sua data de nascimento" mask="00/00/0000">

        <button class="signup-btn">Sign Up</button>

        <p class="login-text">
          Já possui uma conta?
          <a routerLink="/auth/login">Login</a>
        </p>

      </form>

      <h2 class="logo">MIXES</h2>

    </div>

    <!-- PAINEL DIREITO -->
    <div class="right-panel"></div>

  </div>

</div>
