<div class="auth-background">

  <div class="register-container">

    <!-- PAINEL ESQUERDO -->
    <div class="left-panel">

      <button routerLink="/auth/login" class="back-btn">←</button>

      <h1 class="title">SIGN UP</h1>

      <form class="register-form" (ngSubmit)="register()">

        <input type="text" placeholder="Digite seu nome" [(ngModel)]="name" name="name" />

        <input type="text" placeholder="Digite seu CPF" mask="000.000.000-00" [(ngModel)]="cpf" name="cpf"/>

        <input type="email" placeholder="Digite seu email" [(ngModel)]="email" name="email" />

        <input type="password" placeholder="Digite sua senha" [(ngModel)]="password" name="password"/>

        <input type="text" placeholder="Digite sua data de nascimento" mask="00/00/0000" [(ngModel)]="birthday" name="birthday">

        <button type="submit" class="signup-btn">Sign Up</button>

        <p class="login-text">
          Já possui uma conta?
          <a routerLink="/auth/login">Login</a>
        </p>

      </form>

      <h2 class="logo">MIXES</h2>

    </div>

    <!-- PAINEL DIREITO -->
    <div class="right-panel"></div>

  </div>

</div>
