<main>
  <!-- caixa "what's new?" -->
  <section class="content">
    <app-post-writer (postCreated)="onPostCreated($event)"></app-post-writer>
    <section class="posts">
      <app-post *ngFor="let p of posts" [data]="p" [loggedUserId]="loggedUserId" (deleted)="onPostDeleted($event)"> </app-post>
    </section>
  </section>

  <app-rightbar class="rightbar"></app-rightbar>
</main>
