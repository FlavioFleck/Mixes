<div class="profile-box">

  <button *ngIf="isLoggedIn" class="edit-profile-btn" (click)="openModal()">
    Edit profile
  </button>

  <div class="left">

    <!-- Foto de perfil -->
    <div 
      class="profile-picture"
      [ngStyle]="{
        'background-image': profile?.profile_image 
          ? 'url(http://localhost:5010/uploads/profile/' + profile.profile_image + ')'
          : 'url(assets/images/default-avatar.png)'
      }">
    </div>

    <div class="user-info">
      
      <h2 class="username">
        {{ user?.name || 'Username' }}
      </h2>

      <p class="handle">
        @{{ profile?.username || 'username' }}
      </p>

      <p class="bio">
        {{ profile?.bio || 'No bio yet' }}
      </p>

      <nav class="tabs">
        <a routerLink="overview" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
        <a routerLink="posts" routerLinkActive="active">Posts</a>
        <a routerLink="followers" routerLinkActive="active">Followers</a>
        <a routerLink="following" routerLinkActive="active">Following</a>
      </nav>

    </div>
  </div>

  <div class="right">
      <div class="track-box">
          <div class="track-text">
              <span class="label">TOP TRACK</span>
              <h3 class="track-title">Runaway</h3>
              <span class="track-artist">Linkin Park</span>
          </div>
          <img class="track-cover" src="assets/images/main-track.jpg">
      </div>
  </div>

<div class="modal-overlay" *ngIf="isEditModalOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <div class="header-left">
        <span class="material-icons-outlined close-icon" (click)="closeModal()">close</span>
        <h3>Edit Profile</h3>
      </div>
      <button class="save-btn" (click)="saveProfile()">Save</button>
    </div>

    <div class="modal-body">

        <div class="edit-avatar-centered">
            <div class="avatar-circle" (click)="fileInput.click()">
                <span class="material-icons-outlined camera-icon">add_a_photo</span>
                    <input #fileInput type="file" accept="image/*" style="display: none" (change)="handleImage($event)"/>
            </div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" [(ngModel)]="username" [value]="profile?.username" />
        </div>

        <div class="form-group">
            <label>Bio</label>
            <textarea rows="3" [(ngModel)]="bio">{{ profile?.bio }}</textarea>
        </div>
    </div>

    </div>
</div>


</div>
